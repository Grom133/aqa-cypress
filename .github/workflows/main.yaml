name: Cypress Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  hillel-test:
    name: Hillel Tests
    runs-on: ubuntu-latest
    container:
      image: cypress/included:15.11.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run hillel-test specs
        run: npx cypress run --config-file cypress.qauto.config.js --spec "cypress/e2e/hillel-test/**/*.cy.js"

      - name: Upload hillel-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hillel-test-artifacts
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  qauto:
    name: QAuto Tests
    runs-on: ubuntu-latest
    container:
      image: cypress/included:15.11.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run qauto specs
        run: npx cypress run --config-file cypress.qauto.config.js --spec "cypress/e2e/qauto/**/*.cy.js"

      - name: Upload qauto artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qauto-artifacts
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
